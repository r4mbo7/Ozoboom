<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0618" />
    <title>Ozoboom - rendu</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--sol);
        color: var(--texte);
        font-family: system-ui, sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      #stage canvas {
        display: block;
      }

      .panel {
        position: fixed;
        top: 12px;
        left: 12px;
        display: grid;
        gap: 8px;
        max-width: calc(100vw - 24px);
        padding: 10px 12px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--sol-clair) 85%, transparent);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      .panel__stats {
        margin: 0;
        color: var(--turquoise);
      }

      .panel__pointer {
        margin: 0;
      }

      .panel__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .panel__hour {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel__hour input {
        flex: 1;
        accent-color: var(--turquoise);
      }

      .panel button {
        padding: 6px 12px;
        border: 1px solid var(--turquoise);
        border-radius: 999px;
        background: transparent;
        color: var(--texte);
        font: inherit;
        cursor: pointer;
      }

      .panel button[aria-pressed='true'] {
        background: var(--turquoise);
        color: var(--sol);
      }

      .panel button:focus-visible {
        outline: 2px solid var(--mage);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <section class="panel" aria-label="Banc de rendu">
      <p class="panel__stats" id="stats">Chargement…</p>
      <p class="panel__pointer" id="pointer">Pointeur : -</p>
      <div class="panel__actions">
        <button type="button" id="calm" aria-pressed="false">Mode calme</button>
        <button type="button" data-event="beat">Temps</button>
        <button type="button" data-event="enemyDied">Bad vibe éteinte</button>
        <button type="button" data-event="coreHit">Scène touchée</button>
        <button type="button" id="downed" aria-pressed="false">À terre</button>
        <button type="button" id="invulnerable" aria-pressed="false">Invulnérable</button>
      </div>
      <div class="panel__actions" aria-label="Heure du set">
        <button type="button" data-hour="0">Crépuscule</button>
        <button type="button" data-hour="0.4">Nuit</button>
        <button type="button" data-hour="0.85">Aube</button>
        <button type="button" data-hour="1">Plein jour</button>
      </div>
      <label class="panel__hour">
        Heure
        <input type="range" id="hour" min="0" max="1" step="0.005" value="0" />
        <output id="hour-value">0,00</output>
      </label>
    </section>
    <script type="module" src="/src/render/dev.ts"></script>
  </body>
</html>
