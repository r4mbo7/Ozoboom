name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The e2e build bakes the address of the local PeerJS broker, which its shards then serve on.
env:
  E2E_PEER_PORT: '9000'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_TURN_URL: ${{ vars.TURN_URL }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # The e2e build differs from the deployed one: it bakes in the address of the local PeerJS broker.
  e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_PEER_SERVER: localhost:${{ env.E2E_PEER_PORT }}
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-dist
          path: dist
          retention-days: 1

  e2e-chromium:
    needs: e2e-build
    runs-on: ubuntu-latest
    # The browsers and their system libraries come with the image, whose tag follows @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-dist
          path: dist
      - run: pnpm exec playwright test --project chromium --shard ${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The lockstep needs one fingerprint in every engine: only the determinism spec runs there.
  e2e-engines:
    needs: e2e-build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: e2e-dist
          path: dist
      - run: pnpm exec playwright test --project firefox --project webkit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-engines
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The one verdict the merge and the deployment wait for: a skipped or cancelled shard fails it.
  e2e:
    if: always()
    needs: [e2e-build, e2e-chromium, e2e-engines]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.e2e-build.result }}" = success
          test "${{ needs.e2e-chromium.result }}" = success
          test "${{ needs.e2e-engines.result }}" = success

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
